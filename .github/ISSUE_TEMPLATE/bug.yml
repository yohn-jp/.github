name: Bug report
description: Report a defect in behavior, output, or documentation.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill in as
        much detail as you can so the issue is reproducible.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: >-
        A clear and concise description of what the bug is.
      placeholder: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: >-
        Minimal steps to reproduce the behavior. Include commands, inputs,
        and configuration where relevant.
      placeholder: |
        1. Run '...'
        2. With input '...'
        3. See error
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: observed
    attributes:
      label: Observed result
      description: What actually happened? Include error messages or logs if any.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Package/tool version, commit SHA, or release tag affected.
      placeholder: e.g. v1.4.2 or commit abc1234
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: >-
        Operating system, runtime version (e.g. Node.js), and any other
        environment details relevant to reproducing the bug.
      placeholder: |
        - OS:
        - Node.js:
        - Package manager:
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that would help diagnose the issue.
    validations:
      required: false
