name: Feature request
description: Propose new behavior, capability, or enhancement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing an improvement. Please describe the problem
        before the solution so reviewers can evaluate alternatives.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >-
        What problem does this solve? Who is affected, and how are they
        affected today without this change?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered and why you did not choose them.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Which area does this primarily affect?
      options:
        - CI / workflows
        - Repository governance
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, mockups, prior discussion, or anything else relevant.
    validations:
      required: false
