# Sync targets for .github/workflows/sync-org-templates.yml. Each top-level
# key is a target "owner/repo" pushed to directly (no PR, no review gate —
# see docs/github-metadata-inheritance.md). Before adding a repository,
# confirm it doesn't already carry a same-path file with content this repo
# doesn't own — a direct push silently overwrites it.

# yohn-jp/gh-inari: bug.yml/feature.yml there currently carry
# "# Generated by gh-inari from .github/inari; do not edit." — they're
# gh-inari's own generated output. Synced here anyway, by decision: this
# repository's hand-written templates are the shared source until gh-inari
# itself is adopted to generate this repository's templates from a JSON
# schema, at which point that direction reverses.
yohn-jp/gh-inari:
  - source: .github/ISSUE_TEMPLATE/config.yml
    dest: .github/ISSUE_TEMPLATE/config.yml
  - source: .github/ISSUE_TEMPLATE/bug.yml
    dest: .github/ISSUE_TEMPLATE/bug.yml
  - source: .github/ISSUE_TEMPLATE/feature.yml
    dest: .github/ISSUE_TEMPLATE/feature.yml
  - source: .github/ISSUE_TEMPLATE/architecture.yml
    dest: .github/ISSUE_TEMPLATE/architecture.yml
  - source: .github/ISSUE_TEMPLATE/maintenance.yml
    dest: .github/ISSUE_TEMPLATE/maintenance.yml
  - source: .github/ISSUE_TEMPLATE/research.yml
    dest: .github/ISSUE_TEMPLATE/research.yml
  - source: .github/PULL_REQUEST_TEMPLATE/default.md
    dest: .github/PULL_REQUEST_TEMPLATE/default.md
  - source: .github/PULL_REQUEST_TEMPLATE/release.md
    dest: .github/PULL_REQUEST_TEMPLATE/release.md

