version: 1

file-groups:
  common:
    - source: .github/ISSUE_TEMPLATE/config.yml
      dest: .github/ISSUE_TEMPLATE/config.yml
    - source: .github/ISSUE_TEMPLATE/bug.yml
      dest: .github/ISSUE_TEMPLATE/bug.yml
    - source: .github/ISSUE_TEMPLATE/feature.yml
      dest: .github/ISSUE_TEMPLATE/feature.yml
    - source: .github/ISSUE_TEMPLATE/architecture.yml
      dest: .github/ISSUE_TEMPLATE/architecture.yml
    - source: .github/ISSUE_TEMPLATE/maintenance.yml
      dest: .github/ISSUE_TEMPLATE/maintenance.yml
    - source: .github/ISSUE_TEMPLATE/research.yml
      dest: .github/ISSUE_TEMPLATE/research.yml
    - source: .github/PULL_REQUEST_TEMPLATE/default.md
      dest: .github/PULL_REQUEST_TEMPLATE/default.md
    - source: .github/PULL_REQUEST_TEMPLATE/release.md
      dest: .github/PULL_REQUEST_TEMPLATE/release.md
    - source: .github/PULL_REQUEST_TEMPLATE/authority.md
      dest: .github/PULL_REQUEST_TEMPLATE/authority.md
    - source: .github/PULL_REQUEST_TEMPLATE/epic.md
      dest: .github/PULL_REQUEST_TEMPLATE/epic.md
    - source: .github/PULL_REQUEST_TEMPLATE/issue-integration.md
      dest: .github/PULL_REQUEST_TEMPLATE/issue-integration.md
    - source: .github/inari/issues/bug.json
      dest: .github/inari/issues/bug.json
    - source: .github/inari/issues/feature.json
      dest: .github/inari/issues/feature.json
    - source: .github/inari/issues/architecture.json
      dest: .github/inari/issues/architecture.json
    - source: .github/inari/issues/maintenance.json
      dest: .github/inari/issues/maintenance.json
    - source: .github/inari/issues/research.json
      dest: .github/inari/issues/research.json
    - source: .github/inari/pull-requests/default.json
      dest: .github/inari/pull-requests/default.json
    - source: .github/inari/pull-requests/release.json
      dest: .github/inari/pull-requests/release.json
    - source: .github/inari/pull-requests/authority.json
      dest: .github/inari/pull-requests/authority.json
    - source: .github/inari/pull-requests/epic.json
      dest: .github/inari/pull-requests/epic.json
    - source: .github/inari/pull-requests/issue-integration.json
      dest: .github/inari/pull-requests/issue-integration.json
    - source: .github/inari/pr-policy.yml
      dest: .github/inari/pr-policy.yml
    - source: .github/inari/manifest.json
      dest: .github/inari/manifest.json
    - source: .github/ISSUE_TEMPLATE/epic.yml
      dest: .github/ISSUE_TEMPLATE/epic.yml
    - source: .github/inari/issues/epic.json
      dest: .github/inari/issues/epic.json
    - source: .github/ISSUE_TEMPLATE/implementation.yml
      dest: .github/ISSUE_TEMPLATE/implementation.yml
    - source: .github/inari/issues/implementation.json
      dest: .github/inari/issues/implementation.json
  agent-governance:
    - source: .github/agent-governance/AGENTS.md
      dest: .github/agent-governance/AGENTS.md
    - source: .github/agent-governance/skills/
      dest: .github/agent-governance/skills/
      deleteOrphaned: true
    - source: CLAUDE.md
      dest: CLAUDE.md
    - source: docs/agent-change-workflow.md
      dest: .github/agent-governance/change-workflow.md
    - source: docs/agent-runtime-profiles.md
      dest: .github/agent-governance/runtime-profiles.md
    - source: .github/agents/runtime-profiles.json
      dest: .github/agent-governance/runtime-profiles.json
    - source: .github/agents/runtime-profiles.schema.json
      dest: .github/agent-governance/runtime-profiles.schema.json
  governance:
    - source: templates/workflows/governance.yml
      dest: .github/workflows/governance.yml
  issue-governance:
    - source: templates/workflows/issue-governance.yml
      dest: .github/workflows/issue-governance.yml
  prettier-autofix:
    - source: templates/workflows/prettier-autofix.yml
      dest: .github/workflows/prettier-autofix.yml
  gofmt-autofix:
    - source: templates/workflows/gofmt-autofix.yml
      dest: .github/workflows/gofmt-autofix.yml
  npm-release:
    - source: templates/workflows/publish.yml
      dest: .github/workflows/publish.yml
    - source: templates/workflows/release-prepare.yml
      dest: .github/workflows/release-prepare.yml
  governance-scripts:
    - source: scripts/validate-pr.mjs
      dest: scripts/validate-pr.mjs
    - source: scripts/pr-contract-routing.mjs
      dest: scripts/pr-contract-routing.mjs
    - source: scripts/pr-template-marker.mjs
      dest: scripts/pr-template-marker.mjs
    - source: scripts/release-branch.mjs
      dest: scripts/release-branch.mjs
    - source: scripts/epic-branch.mjs
      dest: scripts/epic-branch.mjs
    - source: scripts/validate-issue.mjs
      dest: scripts/validate-issue.mjs
  agent-root:
    - source: AGENTS.md
      dest: AGENTS.md
  go:
    - source: templates/workflows/go-ci.yml
      dest: .github/workflows/ci.yml
    - source: templates/workflows/action-pins.yml
      dest: .github/workflows/action-pins.yml
  majiwari:
    - source: templates/workflows/majiwari-ci.yml
      dest: .github/workflows/ci.yml
    - source: scripts/validate-action-pins.mjs
      dest: scripts/validate-action-pins.mjs
  jinushi-release:
    - source: templates/workflows/jinushi-go-release.yml
      dest: .github/workflows/release.yml

# A bundle is a set of files that only work together (a workflow and the
# local files it references). Groups include bundles by name, so a workflow can
# never be distributed without its dependencies.
bundles:
  codeql:
    - source: templates/workflows/codeql.yml
      dest: .github/workflows/codeql.yml
    - source: .github/codeql/codeql-config.yml
      dest: .github/codeql/codeql-config.yml
  go-codeql:
    - source: templates/workflows/go-codeql.yml
      dest: .github/workflows/codeql.yml
    - source: .github/codeql/codeql-config.yml
      dest: .github/codeql/codeql-config.yml

# Every group includes default-include first; a group lists only what differs.
default-include:
  - common
  - agent-governance

sync-groups:
  standard:
    repositories:
      - yohn-jp/gh-inari
      - yohn-jp/suzukuri
      - yohn-jp/shikitari
      - yohn-jp/wabachi
      - yohn-jp/cli-canon
      - yohn-jp/tsukai
      - yohn-jp/yokodori
    include:
      - codeql
      - governance
      - issue-governance
      - npm-release
      - prettier-autofix

  gh-makami:
    repositories:
      - yohn-jp/gh-makami
    include:
      - governance
      - prettier-autofix

  nawabari:
    repositories:
      - yohn-jp/nawabari
    include:
      - governance
      - issue-governance
      - governance-scripts
      - prettier-autofix

  mottainai:
    repositories:
      - yohn-jp/mottainai
    include: []

  majiwari:
    repositories:
      - yohn-jp/majiwari
    include:
      - agent-root
      - majiwari
      - codeql
      - governance
      - issue-governance
      - prettier-autofix

  jinushi:
    repositories:
      - yohn-jp/jinushi
    include:
      - go
      - go-codeql
      - governance
      - issue-governance
      - gofmt-autofix
      - jinushi-release

  hachidori:
    repositories:
      - yohn-jp/hachidori
      - yohn-jp/matagi
    include:
      - go
      - go-codeql
      - governance
      - issue-governance
      - gofmt-autofix
