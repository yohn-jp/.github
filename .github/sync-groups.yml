version: 1

file-groups:
  issue-forms:
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/bug.yml
    - .github/ISSUE_TEMPLATE/feature.yml
    - .github/ISSUE_TEMPLATE/architecture.yml
    - .github/ISSUE_TEMPLATE/epic.yml
    - .github/ISSUE_TEMPLATE/maintenance.yml
    - .github/ISSUE_TEMPLATE/research.yml
  implementation-issue:
    - .github/ISSUE_TEMPLATE/implementation.yml
  pr-templates:
    - .github/PULL_REQUEST_TEMPLATE/default.md
    - .github/PULL_REQUEST_TEMPLATE/release.md
    - .github/PULL_REQUEST_TEMPLATE/authority.md
    - .github/PULL_REQUEST_TEMPLATE/epic.md
    - .github/PULL_REQUEST_TEMPLATE/issue-integration.md
  issue-contracts:
    - .github/inari/issues/bug.json
    - .github/inari/issues/feature.json
    - .github/inari/issues/architecture.json
    - .github/inari/issues/epic.json
    - .github/inari/issues/maintenance.json
    - .github/inari/issues/research.json
  implementation-contract:
    - .github/inari/issues/implementation.json
  pr-contracts:
    - .github/inari/pull-requests/default.json
    - .github/inari/pull-requests/release.json
    - .github/inari/pull-requests/authority.json
    - .github/inari/pull-requests/epic.json
    - .github/inari/pull-requests/issue-integration.json
  inari-governance:
    - .github/inari/pr-policy.yml
    - .github/inari/manifest.json
  standard-workflows:
    - source: templates/workflows/codeql.yml
      dest: .github/workflows/codeql.yml
    - source: templates/workflows/governance.yml
      dest: .github/workflows/governance.yml
    - source: templates/workflows/issue-governance.yml
      dest: .github/workflows/issue-governance.yml
    - source: templates/workflows/publish.yml
      dest: .github/workflows/publish.yml
    - source: templates/workflows/prettier-autofix.yml
      dest: .github/workflows/prettier-autofix.yml

sync-groups:
  standard:
    repositories:
      - yohn-jp/gh-inari
      - yohn-jp/gh-makami
      - yohn-jp/suzukuri
      - yohn-jp/shikitari
      - yohn-jp/nawabari
      - yohn-jp/wabachi
      - yohn-jp/cli-canon
      - yohn-jp/majiwari
    include:
      - issue-forms
      - implementation-issue
      - pr-templates
      - issue-contracts
      - implementation-contract
      - pr-contracts
      - inari-governance
      - standard-workflows

  mottainai:
    repositories:
      - yohn-jp/mottainai
    include:
      - issue-forms
      - implementation-issue
      - pr-templates
      - issue-contracts
      - implementation-contract
      - pr-contracts
      - inari-governance
