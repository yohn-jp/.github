version: 1

architecture: x86_64

linux:
  canonical_runner: ubuntu-24.04
  supported_distributions:
    - ubuntu-24.04
    - nixos
  init: systemd
  cgroups: v2
  system_e2e:
    workflow: linux-system-e2e.yml
    execution: systemd-user-scope
    user: non-root
    delegated_controllers:
      - cpu
      - memory
      - pids

runtime:
  node: "24"
  nix: required

unsupported:
  - windows
  - macos

policy:
  reusable_workflows_ref: "@main"
  product_verification_owner: consumer
