name: Go development release

# Reusable development-release workflow for Go repositories. The caller owns
# only the binary name and Go build target; this provider verifies the exact
# triggering commit, builds one Linux amd64 binary, and publishes it as a
# development prerelease without touching stable version tags.
on:
  workflow_call:
    inputs:
      binary-name:
        description: Base filename for the published Linux amd64 binary.
        type: string
        required: true
      build-target:
        description: Go package or source target passed to `go build`.
        type: string
        required: true
      working-directory:
        description: Directory containing the Go module to build.
        type: string
        default: "."
    secrets: {}

permissions:
  contents: read

jobs:
  build:
    name: Test and build Linux amd64 binary
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      binary_filename: ${{ steps.inputs.outputs.binary_filename }}
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate reusable inputs
        id: inputs
        shell: bash
        env:
          BINARY_NAME: ${{ inputs.binary-name }}
          BUILD_TARGET: ${{ inputs.build-target }}
        run: |
          set -euo pipefail
          if [[ -z "$BINARY_NAME" || "$BINARY_NAME" == */* || "$BINARY_NAME" == *\\* || "$BINARY_NAME" == *$'\n'* || "$BINARY_NAME" == *$'\r'* ]]; then
            echo "::error::binary-name must be a single filename without line breaks" >&2
            exit 1
          fi
          if [ -z "$BUILD_TARGET" ]; then
            echo "::error::build-target must not be empty" >&2
            exit 1
          fi
          echo "binary_filename=$BINARY_NAME-linux-amd64" >> "$GITHUB_OUTPUT"

      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ inputs.working-directory }}/go.mod
          cache: false

      - name: Run Go tests
        working-directory: ${{ inputs.working-directory }}
        run: go test ./...

      - name: Run Go vet
        working-directory: ${{ inputs.working-directory }}
        run: go vet ./...

      - name: Build Linux amd64 binary
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/go-development-release
          BINARY_FILENAME: ${{ steps.inputs.outputs.binary_filename }}
          BUILD_TARGET: ${{ inputs.build-target }}
        run: |
          set -euo pipefail
          rm -rf -- "$ARTIFACT_DIRECTORY"
          mkdir -p -- "$ARTIFACT_DIRECTORY"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o "$ARTIFACT_DIRECTORY/$BINARY_FILENAME" "$BUILD_TARGET"

      - name: Verify binary and record SHA-256
        id: verify
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/go-development-release
          BINARY_FILENAME: ${{ steps.inputs.outputs.binary_filename }}
        run: |
          set -euo pipefail
          binary="$ARTIFACT_DIRECTORY/$BINARY_FILENAME"
          if [ ! -f "$binary" ] || [ -L "$binary" ] || [ ! -s "$binary" ] || [ ! -x "$binary" ]; then
            echo "::error::expected a non-empty executable regular file at $binary" >&2
            exit 1
          fi
          (
            cd "$ARTIFACT_DIRECTORY"
            sha256sum "$BINARY_FILENAME" > "$BINARY_FILENAME.sha256"
          )
          sha256="$(sha256sum -- "$binary" | awk '{print $1}')"
          echo "binary_filename=$BINARY_FILENAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload verified build bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-development-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-development-release/
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Allocate dev tag and publish prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: go-development-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download verified build bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-development-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/go-development-release

      - name: Verify downloaded build bytes
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/go-development-release
          BINARY_FILENAME: ${{ needs.build.outputs.binary_filename }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          binary="$ARTIFACT_DIRECTORY/$BINARY_FILENAME"
          checksum="$binary.sha256"
          if [ ! -f "$binary" ] || [ ! -s "$binary" ]; then
            echo "::error::downloaded binary is missing or empty: $binary" >&2
            exit 1
          fi
          actual_sha256="$(sha256sum -- "$binary" | awk '{print $1}')"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error::downloaded binary differs from the verified build bytes" >&2
            exit 1
          fi
          expected_checksum_line="$EXPECTED_SHA256  $BINARY_FILENAME"
          if [ ! -f "$checksum" ] || [ "$(cat "$checksum")" != "$expected_checksum_line" ]; then
            echo "::error::downloaded SHA-256 file does not match the verified binary" >&2
            exit 1
          fi

      - name: Publish dev-N prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/go-development-release
          BINARY_FILENAME: ${{ needs.build.outputs.binary_filename }}
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: |
          set -euo pipefail
          binary="$ARTIFACT_DIRECTORY/$BINARY_FILENAME"
          checksum="$binary.sha256"
          actual_sha256="$(sha256sum -- "$binary" | awk '{print $1}')"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "::error::binary changed after verification; refusing to publish" >&2
            exit 1
          fi
          expected_checksum_line="$EXPECTED_SHA256  $BINARY_FILENAME"
          if [ "$(cat "$checksum")" != "$expected_checksum_line" ]; then
            echo "::error::checksum changed after verification; refusing to publish" >&2
            exit 1
          fi

          refs_file="$RUNNER_TEMP/go-development-release-dev-tags"
          gh api --paginate \
            "repos/$GH_REPOSITORY/git/matching-refs/tags/dev-" \
            --jq '.[].ref' > "$refs_file"
          max_sequence=0
          while IFS= read -r ref; do
            if [[ "$ref" =~ ^refs/tags/dev-([0-9]+)$ ]]; then
              digits="${BASH_REMATCH[1]}"
              sequence=$((10#$digits))
              if (( sequence > max_sequence )); then
                max_sequence=$sequence
              fi
            fi
          done < "$refs_file"
          release_tag="dev-$((max_sequence + 1))"

          gh release create "$release_tag" \
            "$binary" \
            "$checksum" \
            --repo "$GH_REPOSITORY" \
            --title "$release_tag" \
            --notes "Automated Linux amd64 development build from $RELEASE_SHA." \
            --target "$RELEASE_SHA" \
            --prerelease \
            --latest=false
