name: Go Windows development release

on:
  workflow_call:
    inputs:
      binary-name:
        description: Base filename for the published Windows amd64 executable.
        type: string
        required: true
      build-target:
        description: Go package or source target passed to go build.
        type: string
        required: true
      working-directory:
        description: Directory containing the Go module to build.
        type: string
        default: "."
    secrets: {}

permissions:
  contents: read

jobs:
  build:
    name: Test and build Windows amd64 executable
    runs-on: windows-2025
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    permissions:
      actions: read
      contents: read
    outputs:
      binary_filename: \${{ steps.inputs.outputs.binary_filename }}
      sha256: \${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - name: Validate reusable inputs
        id: inputs
        shell: pwsh
        env:
          BINARY_NAME: \${{ inputs.binary-name }}
          BUILD_TARGET: \${{ inputs.build-target }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:BINARY_NAME) -or $env:BINARY_NAME.Contains("/") -or $env:BINARY_NAME.Contains("\\") -or $env:BINARY_NAME.Contains("\`n") -or $env:BINARY_NAME.Contains("\`r")) {
            throw "binary-name must be a single filename without line breaks"
          }
          if ([string]::IsNullOrWhiteSpace($env:BUILD_TARGET)) { throw "build-target must not be empty" }
          "binary_filename=$($env:BINARY_NAME)-windows-amd64.exe" >> $env:GITHUB_OUTPUT
      - name: Set up Go from go.mod
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: \${{ inputs.working-directory }}/go.mod
          cache: false
      - name: Run Go tests
        working-directory: \${{ inputs.working-directory }}
        run: go test ./...
      - name: Run Go vet
        working-directory: \${{ inputs.working-directory }}
        run: go vet ./...
      - name: Build Windows amd64 executable
        shell: pwsh
        working-directory: \${{ inputs.working-directory }}
        env:
          ARTIFACT_DIRECTORY: \${{ runner.temp }}\\go-development-release
          BINARY_FILENAME: \${{ steps.inputs.outputs.binary_filename }}
          BUILD_TARGET: \${{ inputs.build-target }}
        run: |
          $ErrorActionPreference = "Stop"
          Remove-Item -Recurse -Force $env:ARTIFACT_DIRECTORY -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $env:ARTIFACT_DIRECTORY | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go build -o (Join-Path $env:ARTIFACT_DIRECTORY $env:BINARY_FILENAME) $env:BUILD_TARGET
      - name: Verify executable and record SHA-256
        id: verify
        shell: pwsh
        env:
          ARTIFACT_DIRECTORY: \${{ runner.temp }}\\go-development-release
          BINARY_FILENAME: \${{ steps.inputs.outputs.binary_filename }}
        run: |
          $ErrorActionPreference = "Stop"
          $binary = Join-Path $env:ARTIFACT_DIRECTORY $env:BINARY_FILENAME
          if (!(Test-Path -LiteralPath $binary -PathType Leaf) -or (Get-Item -LiteralPath $binary).Length -eq 0) { throw "expected a non-empty executable regular file at $binary" }
          $sha256 = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha256  $($env:BINARY_FILENAME)" | Set-Content -LiteralPath "$binary.sha256" -Encoding ascii
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
      - name: Upload verified build bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-windows-development-release-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: \${{ runner.temp }}\\go-development-release\\
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Allocate dev tag and publish prerelease
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    concurrency:
      group: go-windows-development-release-\${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download verified build bytes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-windows-development-release-\${{ github.run_id }}-\${{ github.run_attempt }}
          path: \${{ runner.temp }}/go-development-release
      - name: Verify downloaded build bytes
        shell: bash
        env:
          ARTIFACT_DIRECTORY: \${{ runner.temp }}/go-development-release
          BINARY_FILENAME: \${{ needs.build.outputs.binary_filename }}
          EXPECTED_SHA256: \${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          binary="$ARTIFACT_DIRECTORY/$BINARY_FILENAME"
          checksum="$binary.sha256"
          test -f "$binary" && test -s "$binary"
          actual_sha256="$(sha256sum -- "$binary" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"
          expected_checksum_line="$EXPECTED_SHA256  $BINARY_FILENAME"
          test -f "$checksum" && test "$(tr -d '\r\n' < "$checksum")" = "$expected_checksum_line"
      - name: Publish dev-N prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ARTIFACT_DIRECTORY: \${{ runner.temp }}/go-development-release
          BINARY_FILENAME: \${{ needs.build.outputs.binary_filename }}
          EXPECTED_SHA256: \${{ needs.build.outputs.sha256 }}
          GH_TOKEN: \${{ github.token }}
          GH_REPOSITORY: \${{ github.repository }}
          RELEASE_SHA: \${{ github.sha }}
          RUNNER_TEMP: \${{ runner.temp }}
        run: |
          set -euo pipefail
          binary="$ARTIFACT_DIRECTORY/$BINARY_FILENAME"
          checksum="$binary.sha256"
          actual_sha256="$(sha256sum -- "$binary" | awk '{print $1}')"
          test "$actual_sha256" = "$EXPECTED_SHA256"
          expected_checksum_line="$EXPECTED_SHA256  $BINARY_FILENAME"
          test "$(tr -d '\r\n' < "$checksum")" = "$expected_checksum_line"
          refs_file="$RUNNER_TEMP/go-windows-development-release-dev-tags"
          gh api --paginate "repos/$GH_REPOSITORY/git/matching-refs/tags/dev-" --jq '.[].ref' > "$refs_file"
          max_sequence=0
          while IFS= read -r ref; do
            if [[ "$ref" =~ ^refs/tags/dev-([0-9]+)$ ]]; then
              digits="\${BASH_REMATCH[1]}"
              sequence=$((10#$digits))
              if (( sequence > max_sequence )); then max_sequence=$sequence; fi
            fi
          done < "$refs_file"
          release_tag="dev-$((max_sequence + 1))"
          gh release create "$release_tag" "$binary" "$checksum" --repo "$GH_REPOSITORY" --title "$release_tag" --notes "Automated Windows amd64 development build from $RELEASE_SHA." --target "$RELEASE_SHA" --prerelease --latest=false
