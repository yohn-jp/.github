name: Metadata validation

# Deterministic validation for GitHub repository metadata: Issue Form
# structure, organization/third-party Action reference policy, and GitHub Actions workflow
# syntax. Callable as a reusable workflow so other yohn-jp repositories can
# consume the same gate instead of duplicating validation logic; also runs
# directly here to self-validate this repository's own defaults.
on:
  workflow_call: {}
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    name: Validate repository metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A reusable workflow's own files are not part of the caller's
      # checkout above. job.workflow_repository/job.workflow_sha identify
      # the exact repository and commit that DEFINE this job (the provider
      # revision selected by the caller (organization reusable workflow callers
      # use `@main`), so the tooling checkout below always matches the version
      # of validate-*.mjs selected for the run, including when this workflow
      # is triggered directly (push/pull_request) in yohn-jp/.github itself.
      # Never use github.sha here: that is the caller's checked-out commit,
      # not necessarily this provider repository's.
      - name: Checkout metadata validation tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .metadata-tools

      # actions/checkout only accepts paths below GITHUB_WORKSPACE. Move the
      # provider checkout out of the consumer workspace before pnpm or any
      # provider validator runs, so pnpm cannot discover the consumer's
      # pnpm-workspace.yaml while installing the provider package.
      - name: Isolate metadata validation tooling
        shell: bash
        run: mv .metadata-tools "$RUNNER_TEMP/metadata-tools"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Prepare provider pnpm metadata
        shell: bash
        run: |
          mkdir -p .provider-pnpm
          cp "$RUNNER_TEMP/metadata-tools/package.json" .provider-pnpm/package.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: .provider-pnpm/package.json

      - name: Isolate provider pnpm metadata
        shell: bash
        run: mv .provider-pnpm "$RUNNER_TEMP/provider-pnpm-metadata"

      - name: Install validator dependencies
        working-directory: ${{ runner.temp }}/metadata-tools
        run: pnpm install --frozen-lockfile

      - name: Validate Issue Forms
        run: node "$RUNNER_TEMP/metadata-tools/scripts/validate-issue-forms.mjs"

      - name: Validate Action reference policy
        run: node "$RUNNER_TEMP/metadata-tools/scripts/validate-action-pins.mjs"

      - name: Validate provider tooling cross-repository resolution
        run: node "$RUNNER_TEMP/metadata-tools/scripts/validate-provider-tooling-resolution.mjs"

      - name: Validate synchronized governance script formatting
        run: node "$RUNNER_TEMP/metadata-tools/scripts/validate-synced-script-format.mjs"

      - name: Validate Inari JSON formatting
        run: node "$RUNNER_TEMP/metadata-tools/scripts/validate-inari-format.mjs"

      - name: Validate Inari snapshot provenance
        run: node "$RUNNER_TEMP/metadata-tools/scripts/generate-inari-manifest.mjs" --check

      - name: Install gh-inari
        run: npm install --global gh-inari@0.9.0

      - name: Check semantic template projection drift
        run: gh-inari template sync --check

      - name: Download actionlint
        shell: bash
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Run actionlint
        shell: bash
        run: |
          if [ -d .github/workflows ]; then
            # -ignore suppresses a known actionlint schema gap: job.workflow_repository,
            # job.workflow_sha, and job.workflow_ref are real, GA `job` context
            # properties (used above to resolve the exact provider revision
            # selected by the caller) that actionlint's embedded context schema does
            # not yet include as of v1.7.12 (rhysd/actionlint#647, fix in
            # progress as rhysd/actionlint#707).
            actionlint -color \
              -ignore 'property "workflow_repository" is not defined' \
              -ignore 'property "workflow_sha" is not defined' \
              -ignore 'property "workflow_ref" is not defined'
          else
            echo "No .github/workflows directory; skipping actionlint."
          fi

      - name: Restore provider pnpm metadata for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-pnpm-metadata" ] && [ ! -e .provider-pnpm ]; then
            mv "$RUNNER_TEMP/provider-pnpm-metadata" .provider-pnpm
          fi
