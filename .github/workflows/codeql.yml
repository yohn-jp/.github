name: CodeQL

# Reusable CodeQL security scanning for JavaScript/TypeScript and GitHub
# Actions workflows, callable from consumer repositories. Also runs
# directly here (push/pull_request/schedule) to scan this repository's own
# scripts/ and workflows.
on:
  workflow_call:
    inputs:
      languages:
        description: >-
          Comma-separated CodeQL language identifiers to analyze, each run
          as its own isolated matrix job.
        type: string
        default: "javascript-typescript,actions"
      config-file:
        description: >-
          Optional path (relative to the consumer repository root) to a
          CodeQL config file, e.g. .github/codeql/codeql-config.yml. Empty
          (default) uses CodeQL's default configuration for each language.
        type: string
        default: ""
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.split.outputs.languages }}
    steps:
      - name: Split languages input into a JSON array
        id: split
        shell: bash
        env:
          LANGUAGES: ${{ inputs.languages || 'javascript-typescript,actions' }}
        run: |
          languages_json="$(echo "$LANGUAGES" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')"
          echo "languages=$languages_json" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.plan.outputs.languages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL (with local config)
        if: inputs.config-file != ''
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          config-file: ${{ inputs.config-file }}

      - name: Initialize CodeQL (default config)
        if: inputs.config-file == ''
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
