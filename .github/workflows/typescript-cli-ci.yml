name: TypeScript CLI CI

# Reusable CI contract for yohn-jp TypeScript CLI repositories: format,
# lint, typecheck, test, Actions governance, build, and packed-package
# validation, behind a single stable "verify" aggregate status that
# Rulesets can require without tracking internal job names. Differences
# between consumer repositories are expressed as explicit inputs, never as
# repository-name conditionals.
on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the CLI package (package.json, src/, etc).
        type: string
        default: "."
      node-version:
        description: Node.js version used across all jobs.
        type: string
        default: "24"
      format-script:
        description: >-
          package.json script name for format validation. Empty skips the
          format lane for consumers that do not define one.
        type: string
        default: "format:check"
      lint-script:
        description: >-
          package.json script name for lint validation. Empty skips the lint
          lane for consumers that do not define one.
        type: string
        default: "lint"
      canonical-release-preflight:
        description: >-
          Run the canonical npm-publish.yml release engine with dry-run=true
          on pull requests and main. Default false preserves existing consumer
          certification ordering until each repository explicitly opts in.
        type: boolean
        default: false
      committed-dist:
        description: >-
          Verify the committed dist/ directory is byte-identical to a fresh
          build. Enable for repositories that commit build output.
        type: boolean
        default: false
      release-docs-fast-path:
        description: >-
          On pull requests whose changed files all match
          docs-path-patterns, skip format/lint/typecheck/test/build/package
          validation and run only Actions governance validation.
        type: boolean
        default: false
      docs-path-patterns:
        description: Newline-separated glob patterns considered docs-only.
        type: string
        default: |
          docs/**
          **/*.md
          CHANGELOG.md
      conformance-script:
        description: >-
          Optional package.json script name to run as an explicit
          conformance-validation step (e.g. validating CLI output against a
          contract). Empty (default) skips this step.
        type: string
        default: ""
      run-governance:
        description: >-
          Run Actions/Issue-Form governance validation (from
          metadata-validation.yml) as part of this workflow. Disable only if
          the consumer already runs it separately.
        type: boolean
        default: true
      test-setup-command:
        description: >-
          Optional repository-owned shell command run immediately before the
          test command. Empty (default) performs no setup. Use this only for
          explicit test-environment prerequisites; keep shared CI repository-neutral.
        type: string
        default: ""
      package-preparation-command:
        description: >-
          Optional consumer-owned command that prepares one package tarball.
          Empty (default) runs the shared build and pnpm pack. The command must
          leave exactly one .tgz in working-directory and keep lifecycle scripts enabled.
        type: string
        default: ""
    outputs:
      package-artifact-name:
        description: Revision-bound package artifact produced and smoke-tested by verify.
        value: ${{ jobs.build.outputs.package_artifact_name }}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      fast_path: ${{ steps.decide.outputs.fast_path }}
      publish_dry_run: ${{ steps.publish-workflow.outputs.dry_run }}
      publish_working_directory: ${{ steps.publish-workflow.outputs.working_directory }}
      publish_node_version: ${{ steps.publish-workflow.outputs.node_version }}
      publish_smoke_test_node_versions: ${{ steps.publish-workflow.outputs.smoke_test_node_versions }}
      publish_certification_script: ${{ steps.publish-workflow.outputs.certification_script }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout metadata validation tooling (yohn-jp/.github)
        if: inputs.release-docs-fast-path && github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .metadata-tools

      - name: Isolate metadata validation tooling
        if: inputs.release-docs-fast-path && github.event_name == 'pull_request'
        shell: bash
        run: mv .metadata-tools "$RUNNER_TEMP/metadata-tools"

      - name: Decide fast path
        id: decide
        shell: bash
        env:
          FAST_PATH_ENABLED: ${{ inputs.release-docs-fast-path }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          PATTERNS: ${{ inputs.docs-path-patterns }}
        run: |
          if [ "$FAST_PATH_ENABLED" != "true" ] || [ "$IS_PULL_REQUEST" != "true" ]; then
            echo "fast_path=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # PATTERNS is intentionally word-split: docs-path-patterns is a
          # newline-separated list meant to become one argv entry per line.
          # shellcheck disable=SC2086
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | node "$RUNNER_TEMP/metadata-tools/scripts/is-docs-only-change.mjs" $PATTERNS; then
            echo "fast_path=true" >> "$GITHUB_OUTPUT"
          else
            echo "fast_path=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect consumer publish workflow
        id: publish-workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow=.github/workflows/publish.yml
          if [ ! -f "$workflow" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Mirror the consumer's own npm-publish.yml inputs so the dry run
          # packs and smoke-tests exactly what its release would.
          with="$(yq -o=json '[.jobs[] | select((.uses // "") | contains("/.github/workflows/npm-publish.yml@")) | .with // {}] | .[0] // null' "$workflow")"
          if [ "$with" = "null" ]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "dry_run=true"
            echo "working_directory=$(jq -r '."working-directory" // "."' <<<"$with")"
            echo "node_version=$(jq -r '."node-version" // "24"' <<<"$with")"
            echo "smoke_test_node_versions=$(jq -r '."smoke-test-node-versions" // "24"' <<<"$with")"
            echo "certification_script=$(jq -r '."certification-verification-script" // ""' <<<"$with")"
          } >> "$GITHUB_OUTPUT"

  governance:
    name: Actions governance validation
    needs: plan
    if: inputs.run-governance
    uses: ./.github/workflows/metadata-validation.yml

  format:
    name: Format check
    needs: plan
    if: needs.plan.outputs.fast_path != 'true' && inputs.format-script != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout provider tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
      - uses: ./.provider-tools/.github/actions/setup-runtime
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - working-directory: ${{ inputs.working-directory }}
        env:
          FORMAT_SCRIPT: ${{ inputs.format-script }}
        run: pnpm run "$FORMAT_SCRIPT"
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-tools" ] && [ ! -e .provider-tools ]; then
            mv "$RUNNER_TEMP/provider-tools" .provider-tools
          fi

  lint:
    name: Lint
    needs: plan
    if: needs.plan.outputs.fast_path != 'true' && inputs.lint-script != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout provider tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
      - uses: ./.provider-tools/.github/actions/setup-runtime
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - working-directory: ${{ inputs.working-directory }}
        env:
          LINT_SCRIPT: ${{ inputs.lint-script }}
        run: pnpm run "$LINT_SCRIPT"
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-tools" ] && [ ! -e .provider-tools ]; then
            mv "$RUNNER_TEMP/provider-tools" .provider-tools
          fi

  typecheck:
    name: Typecheck
    needs: plan
    if: needs.plan.outputs.fast_path != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout provider tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
      - uses: ./.provider-tools/.github/actions/setup-runtime
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - working-directory: ${{ inputs.working-directory }}
        run: pnpm run typecheck
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-tools" ] && [ ! -e .provider-tools ]; then
            mv "$RUNNER_TEMP/provider-tools" .provider-tools
          fi

  test:
    name: Test
    needs: plan
    if: needs.plan.outputs.fast_path != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout provider tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
      - uses: ./.provider-tools/.github/actions/setup-runtime
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - name: Consumer test setup
        if: inputs.test-setup-command != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TEST_SETUP_COMMAND: ${{ inputs.test-setup-command }}
        run: bash -euo pipefail -c "$TEST_SETUP_COMMAND"
      - working-directory: ${{ inputs.working-directory }}
        run: pnpm test
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-tools" ] && [ ! -e .provider-tools ]; then
            mv "$RUNNER_TEMP/provider-tools" .provider-tools
          fi

  conformance:
    name: Conformance validation
    needs: plan
    if: needs.plan.outputs.fast_path != 'true' && inputs.conformance-script != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout provider tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
      - uses: ./.provider-tools/.github/actions/setup-runtime
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - working-directory: ${{ inputs.working-directory }}
        env:
          CONFORMANCE_SCRIPT: ${{ inputs.conformance-script }}
        run: pnpm run "$CONFORMANCE_SCRIPT"
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-tools" ] && [ ! -e .provider-tools ]; then
            mv "$RUNNER_TEMP/provider-tools" .provider-tools
          fi

  build:
    name: Build
    needs: plan
    if: needs.plan.outputs.fast_path != 'true'
    runs-on: ubuntu-24.04
    outputs:
      package_artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Checkout provider tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
      - uses: ./.provider-tools/.github/actions/setup-runtime
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - name: Verify exact evaluated revision
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare, inspect, and identify package artifact
        id: package
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_PREPARATION_COMMAND: ${{ inputs.package-preparation-command }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -f ./*.tgz
          if [ -n "$PACKAGE_PREPARATION_COMMAND" ]; then
            bash -euo pipefail -c "$PACKAGE_PREPARATION_COMMAND"
          else
            pnpm run build
            pnpm pack
          fi
          shopt -s nullglob
          tarballs=( ./*.tgz )
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::package preparation must produce exactly one .tgz file" >&2
            exit 1
          fi
          artifact_dir="$RUNNER_TEMP/typescript-cli-package"
          node "$RUNNER_TEMP/provider-tools/scripts/ci-package-artifact.mjs" \
            create \
            --archive "$PWD/${tarballs[0]}" \
            --directory "$artifact_dir" \
            --source-sha "$SOURCE_SHA"
          echo "artifact_name=typescript-cli-package-$SOURCE_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.committed-dist
        with:
          name: typescript-cli-dist-${{ github.sha }}
          path: ${{ inputs.working-directory }}/dist
          retention-days: 1
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/typescript-cli-package
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-tools" ] && [ ! -e .provider-tools ]; then
            mv "$RUNNER_TEMP/provider-tools" .provider-tools
          fi

  committed-dist-check:
    name: Committed dist verification
    needs: [plan, build]
    if: inputs.committed-dist && needs.plan.outputs.fast_path != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: typescript-cli-dist-${{ github.sha }}
          path: ${{ inputs.working-directory }}/.built-dist
      - shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          if ! diff -rq dist .built-dist; then
            echo "::error::committed dist/ does not match a fresh build. Run the build and commit the result." >&2
            exit 1
          fi

  package-validate:
    name: Package validation
    needs: [plan, build]
    if: needs.plan.outputs.fast_path != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: false
      - name: Checkout provider package verifier (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
          persist-credentials: false
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package_artifact_name }}
          path: ${{ runner.temp }}/typescript-cli-package
      - name: Verify exact revision and package bytes
        env:
          EXPECTED_SHA: ${{ github.sha }}
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/typescript-cli-package
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node "$RUNNER_TEMP/provider-tools/scripts/ci-package-artifact.mjs" \
            verify \
            --directory "$ARTIFACT_DIRECTORY" \
            --expected-sha "$EXPECTED_SHA"
      - name: Smoke test installed package artifact
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TARBALL: ${{ runner.temp }}/typescript-cli-package/package.tgz
        run: |
          set -euo pipefail
          smoke_dir="$(mktemp -d)"
          echo '{"private":true}' > "$smoke_dir/package.json"
          npm install --no-save --prefix "$smoke_dir" "$TARBALL"
          bin_names="$(node -e '
            const path = require("node:path");
            const pkg = require(path.resolve("package.json"));
            const bin = pkg.bin;
            if (!bin) process.exit(0);
            const names = typeof bin === "string" ? [pkg.name] : Object.keys(bin);
            console.log(names.join("\n"));
          ')"
          if [ -z "$bin_names" ]; then
            echo "No bin entries declared in package.json; skipping executable smoke test."
            exit 0
          fi
          while IFS= read -r bin_name; do
            [ -z "$bin_name" ] && continue
            "$smoke_dir/node_modules/.bin/$bin_name" --version || \
              "$smoke_dir/node_modules/.bin/$bin_name" --help
          done <<< "$bin_names"
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/provider-tools" ] && [ ! -e .provider-tools ]; then
            mv "$RUNNER_TEMP/provider-tools" .provider-tools
          fi

  npm-publish-dry-run:
    name: npm publish dry run
    needs: plan
    if: >-
      needs.plan.outputs.fast_path != 'true' &&
      needs.plan.outputs.publish_dry_run == 'true' &&
      !inputs.canonical-release-preflight &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/npm-publish-dry-run.yml
    with:
      working-directory: ${{ needs.plan.outputs.publish_working_directory }}
      node-version: ${{ needs.plan.outputs.publish_node_version }}
      smoke-test-node-versions: ${{ needs.plan.outputs.publish_smoke_test_node_versions }}
      certification-verification-script: ${{ needs.plan.outputs.publish_certification_script }}
    permissions:
      contents: read

  canonical-npm-publish-dry-run:
    name: Canonical npm publish dry run
    needs: plan
    if: >-
      needs.plan.outputs.fast_path != 'true' &&
      needs.plan.outputs.publish_dry_run == 'true' &&
      inputs.canonical-release-preflight &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/npm-publish.yml
    with:
      working-directory: ${{ needs.plan.outputs.publish_working_directory }}
      node-version: ${{ needs.plan.outputs.publish_node_version }}
      smoke-test-node-versions: ${{ needs.plan.outputs.publish_smoke_test_node_versions }}
      certification-verification-script: ${{ needs.plan.outputs.publish_certification_script }}
      dry-run: true
    permissions:
      contents: read

  verify:
    name: verify
    if: always()
    needs:
      - plan
      - governance
      - format
      - lint
      - typecheck
      - test
      - conformance
      - build
      - committed-dist-check
      - package-validate
      - npm-publish-dry-run
      - canonical-npm-publish-dry-run
    runs-on: ubuntu-24.04
    steps:
      - name: Check required job results
        shell: bash
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ',') }}
        run: |
          echo "Job results: $RESULTS"
          IFS=',' read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::one or more required jobs did not succeed (result: $r)" >&2
              exit 1
            fi
          done
          echo "All required jobs succeeded or were intentionally skipped."
