name: PR governance

# Reusable baseline PR governance: event plumbing and enforcement around the
# canonical gh-inari branch, route, title, and PR-content validators. The
# adapter is checked out from this repository, while its root is the consumer
# checkout, so contract compilation reads the consumer's synchronized
# .github/inari snapshot and native templates.
on:
  workflow_call:
    inputs:
      branch-name-pattern:
        description: >-
          Legacy compatibility regex for an ordinary development PR's head
          branch name. Canonical ordinary and integration branch grammar is
          owned by Inari; this input may only narrow an already-canonical
          branch.
        type: string
        default: '^(feat|fix|docs|refactor|test|chore)/\d+-[a-z0-9-]+$'
      branch-name-exempt:
        description: Comma-separated branch names exempt from the pattern.
        type: string
        default: "main"
      skip-branch-name-check:
        type: boolean
        default: false
      skip-pr-contract-check:
        type: boolean
        default: false
      integration-routing:
        description: >-
          Optional JSON route evidence accepted by Inari's canonical
          integration-routing projector. Observed PR head/base refs are added
          by the adapter before validation.
        type: string
        default: ""

# Intentionally workflow_call-only: this repository's own PRs come from an
# automated harness with a fixed, non-conventional branch-naming scheme,
# and its Issue Forms were not authored against gh-inari's contract model —
# self-triggering here would either fail this repository's own PRs on a
# convention they can't follow, or exercise the gh-inari check against
# content it was never meant to validate. Consumer repositories are the
# real integration point; see docs/governance.md.

concurrency:
  group: pr-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened') && !inputs.skip-branch-name-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .governance-tools

      - name: Isolate governance tooling
        shell: bash
        run: mv .governance-tools "$RUNNER_TEMP/governance-tools"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install shared governance validator
        working-directory: ${{ runner.temp }}/governance-tools
        run: npm install --no-save --omit=dev gh-inari@latest

      - name: Validate branch name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BRANCH_NAME_PATTERN: ${{ inputs.branch-name-pattern }}
          BRANCH_NAME_EXEMPT: ${{ inputs.branch-name-exempt }}
        run: node "$RUNNER_TEMP/governance-tools/scripts/validate-branch-name.mjs" --branch "$HEAD_REF"

  validate-pr-contract:
    name: Validate PR contract (Inari snapshot)
    if: github.event_name == 'pull_request' && !inputs.skip-pr-contract-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout consumer governance snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Checkout governance tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .governance-tools

      - name: Isolate governance tooling
        shell: bash
        run: mv .governance-tools "$RUNNER_TEMP/governance-tools"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install shared governance validator
        working-directory: ${{ runner.temp }}/governance-tools
        run: npm install --no-save --omit=dev gh-inari@latest

      - name: Validate synchronized governance snapshot
        run: node "$RUNNER_TEMP/governance-tools/scripts/generate-inari-manifest.mjs" --check

      - name: Validate PR contract
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          INARI_ROUTING: ${{ inputs.integration-routing }}
        run: |
          set -euo pipefail
          node "$RUNNER_TEMP/governance-tools/scripts/validate-pr.mjs" --event "$GITHUB_EVENT_PATH" --branch "$PR_BRANCH"
