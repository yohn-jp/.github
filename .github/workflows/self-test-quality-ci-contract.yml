name: Self-test Organization Quality CI Contract

# Validate the provider-owned machine-readable boundary on every provider
# change. Lane implementations and consumer-specific commands are tested in
# their own workflows; this check catches malformed wiring before rollout.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Validate quality CI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout provider
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.0.0
        with:
          version: 9.15.4
      - name: Install provider dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contract and fixtures
        run: pnpm run validate:quality-contract
      - name: Run contract tests
        run: node --test test/quality-ci-contract.test.mjs
