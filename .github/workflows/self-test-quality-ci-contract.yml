name: Self-test Organization Quality CI Contract

# Validate the provider-owned machine-readable boundary on every provider
# change. Lane implementations and consumer-specific commands are tested in
# their own workflows; this check catches malformed wiring before rollout.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Validate quality CI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout provider
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.25.0
      - name: Install provider dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate contract and fixtures
        run: pnpm run validate:quality-contract
      - name: Run contract tests
        run: node --test test/quality-ci-contract.test.mjs
      - name: Run test-effectiveness contract tests
        run: node --test test/test-effectiveness-contract.test.mjs
      - name: Run static-quality provider tests
        run: node --test test/static-quality.test.mjs
      - name: Run organization-quality aggregate status tests
        run: node --test test/aggregate-quality-status.test.mjs
      - name: Run organization-quality wiring tests
        run: node --test test/organization-quality-wiring.test.mjs
      - name: Run consumer revision selection tests
        run: node --test test/select-consumer-revision.test.mjs

  static-quality:
    name: Execute static-quality fixture
    uses: ./.github/workflows/static-quality.yml
    with:
      working-directory: test/fixtures/static-quality/pass
      execution-mode: ${{ github.event_name == 'push' && 'main' || 'pr' }}
      config-file: test/fixtures/static-quality/pass/static-quality.yml
