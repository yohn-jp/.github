name: Sync org templates

# Distributes this repository's Issue Forms, PR templates, machine-readable
# Inari governance snapshot, and shared governance adapters
# (.github/ISSUE_TEMPLATE/*.yml, .github/PULL_REQUEST_TEMPLATE/*.md),
# opt-in workflow wrappers (templates/workflows/*.yml), and the opt-in
# Action-pin governance script (scripts/validate-action-pins.mjs) to the
# repositories listed in .github/sync.yml, pushing directly to each
# target's default branch. See docs/github-metadata-inheritance.md — this
# workflow is the org's only distribution path for these files; GitHub's
# own implicit community-health file inheritance does not apply once PR
# templates live under PULL_REQUEST_TEMPLATE/ instead of a single
# pull_request_template.md.
on:
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/inari/**"
      - ".github/sync.yml"
      - "templates/workflows/**"
      - "scripts/validate-action-pins.mjs"
      - "scripts/generate-inari-manifest.mjs"
      - "scripts/validate-pr.mjs"
      - "scripts/validate-issue.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-org-templates
  cancel-in-progress: false

jobs:
  sync:
    name: Sync managed templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Generate Inari snapshot manifest
        run: node scripts/generate-inari-manifest.mjs

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ORG_TEMPLATE_SYNC_APP_ID }}
          private-key: ${{ secrets.ORG_TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          # Without `repositories`, the token is scoped only to the repo the
          # workflow runs in (yohn-jp/.github) even though the App itself is
          # installed org-wide — every sync target then gets a token with no
          # access to it, which the Git Data API calls in the next step
          # report as "Resource not accessible by integration". Must list
          # every push target from .github/sync.yml.
          repositories: |
            gh-inari
            gh-makami
            suzukuri
            nawabari
            mottainai
            wabachi

      - name: Sync templates to org repositories
        uses: BetaHuhn/repo-file-sync-action@8b92be3375cf1d1b0cd579af488a9255572e4619 # v1.21.1
        with:
          # Must be GH_INSTALLATION_TOKEN, not GH_PAT: the action only
          # prefixes the push URL with `x-access-token:` (the form GitHub
          # App installation tokens require) when IS_INSTALLATION_TOKEN is
          # set, which only happens via this input. Passing an App token
          # as GH_PAT makes it build `https://<token>@github.com/...`,
          # which git reads as a bare username with no password and fails
          # non-interactively with "could not read Password ... No such
          # device or address" on every target.
          #
          # GH_INSTALLATION_TOKEN itself requires v1.21.1: the previously
          # pinned v1.9.4 predates that input entirely — its dist/index.js
          # hardcodes GH_PAT as the only (required) token input and always
          # builds the push URL as `https://${GITHUB_TOKEN}@...` with no
          # `x-access-token:` prefix, so no input combination on that
          # version can push with a GitHub App token.
          GH_INSTALLATION_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_EMAIL: yohn-jp-template-sync[bot]@users.noreply.github.com
          GIT_USERNAME: yohn-jp-template-sync[bot]
          CONFIG_PATH: .github/sync.yml
          SKIP_PR: true
          COMMIT_PREFIX: "chore: sync org-managed files"
          # Default COMMIT_EACH_FILE (true) makes the action create one
          # commit per synced file per target repo — a single sync run
          # against .github/sync.yml fans out into a dozen-plus commits on
          # each target. false batches every changed file for a target into
          # one commit instead.
          COMMIT_EACH_FILE: false
