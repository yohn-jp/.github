name: npm publish

# Reusable release-triggered npm publishing: build/test, verify the release
# tag matches package.json's version, pack one exact tarball, certify that
# tarball, smoke-test the same bytes across a Node-version matrix, then
# publish them via npm Trusted Publishing (OIDC) — no long-lived npm token
# secret. Package name/version are discovered from package.json, never from
# repository-name branching.
on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing immutable GitHub Release tag to retry.
        required: true
        type: string
      repository:
        description: Consumer repository in owner/name form.
        required: true
        type: string
      certification-verification-script:
        description: Consumer-owned release certification script.
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the package to publish.
        type: string
        default: "."
      node-version:
        description: Node.js version used for build/test/publish.
        type: string
        default: "24"
      smoke-test-node-versions:
        description: Comma-separated Node.js versions to smoke-test the packed tarball on.
        type: string
        default: "24"
      npm-cli-version:
        description: >-
          Minimum npm CLI version required for OIDC Trusted Publishing,
          installed globally before `npm publish`.
        type: string
        default: "12.0.2"
      certification-verification-script:
        description: >-
          Optional path (relative to working-directory) to a consumer-owned,
          version-controlled script that fails closed unless the consumer's
          own release-certification evidence is complete and valid. It runs
          after the exact tarball is packed and before that tarball is made
          available to smoke/publish, with only the documented generic
          release context in environment variables. The script receives no
          workflow-controlled arguments and exits non-zero to block release.
          Empty (default) skips this gate entirely for consumers that don't
          define one.
        type: string
        default: ""
      dry-run:
        description: >-
          Run everything except publish (build, typecheck, test, repository.url
          check, pack, smoke test) against the checked-out ref instead of a
          release tag, so release-only failures surface before a Release is
          created. The certification gate runs against the exact dry-run
          tarball with synthetic release context derived from the checked-out SHA.
        type: boolean
        default: false
      release-tag:
        description: >-
          Existing immutable release tag to publish when retrying outside a
          release.published event. Empty uses github.event.release.tag_name.
        type: string
        default: ""
    secrets: {}

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      smoke_test_node_versions: ${{ steps.split.outputs.versions }}
    steps:
      - name: Split smoke-test-node-versions into a JSON array
        id: split
        shell: bash
        env:
          VERSIONS: ${{ inputs.smoke-test-node-versions }}
        run: |
          versions_json="$(echo "$VERSIONS" | tr ',' '\n' | jq -R -s -c 'split("\n") | map(gsub("^\\s+|\\s+$";"")) | map(select(length > 0))')"
          echo "versions=$versions_json" >> "$GITHUB_OUTPUT"

  build:
    name: Build and pack
    runs-on: ubuntu-24.04
    # Immutable release builds reuse the tagged lockfile, including nested consumer pnpm commands.
    # Keep ignored dependency scripts blocked but non-fatal across the whole build job.
    # Do not apply this policy to fresh resolution outside this build job.
    env:
      PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
      PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
    permissions:
      actions: read
      contents: read
    outputs:
      package-name: ${{ steps.package.outputs.name }}
      package-version: ${{ steps.package.outputs.version }}
      tarball-name: ${{ steps.pack.outputs.name }}
      tarball-sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - name: Checkout
        if: ${{ !inputs.dry-run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          ref: refs/tags/${{ inputs.release-tag != '' && inputs.release-tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Checkout (dry-run)
        if: ${{ inputs.dry-run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve release context
        id: release-context
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          RELEASE_TAG: ${{ inputs.release-tag != '' && inputs.release-tag || github.event.release.tag_name }}
          TARGET_REPOSITORY: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != "true" ] && [ -n "${RELEASE_TAG:-}" ]; then
            release_json="$(gh api "repos/$TARGET_REPOSITORY/releases/tags/$RELEASE_TAG")"
            test "$(jq -r '.draft' <<<"$release_json")" = "false"
            test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
            test "$(jq -r '.immutable' <<<"$release_json")" = "true"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            source_sha="$DRY_RUN_SHA"
            RELEASE_TAG="v$(node -p 'require(process.argv[1]).version' "$PWD/$WORKING_DIRECTORY/package.json")"
          else
            source_sha="$(git rev-parse HEAD)"
          fi
          {
            echo "source_sha=$source_sha"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout release tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - uses: ./.release-tools/.github/actions/setup-node-pnpm
        with:
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}

      - name: Isolate release tooling
        shell: bash
        run: mv .release-tools "$RUNNER_TEMP/release-tools"

      - name: Typecheck
        working-directory: ${{ inputs.working-directory }}
        run: pnpm run typecheck

      - name: Test
        working-directory: ${{ inputs.working-directory }}
        run: pnpm test

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: pnpm run build

      - name: Read package metadata
        id: package
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ steps.release-context.outputs.tag }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: node "$RUNNER_TEMP/release-tools/scripts/check-release-version.mjs" --package-version "$PACKAGE_VERSION" --tag "$RELEASE_TAG"

      - name: Verify package.json repository.url
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_REPOSITORY_SLUG: ${{ github.repository }}
        run: node "$RUNNER_TEMP/release-tools/scripts/check-repository-url.mjs" --package-json package.json --repository "$GITHUB_REPOSITORY_SLUG"

      - name: Pack tarball
        id: pack
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          existing_tarballs=( ./*.tgz )
          if [ "${#existing_tarballs[@]}" -gt 0 ]; then
            rm -f -- "${existing_tarballs[@]}"
          fi
          pnpm pack
          tarballs=( ./*.tgz )
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "::error::expected exactly one packed tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          tarball="${tarballs[0]}"
          {
            echo "name=$(basename "$tarball")"
            echo "path=$PWD/${tarball#./}"
            echo "sha256=$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release certification
        if: inputs.certification-verification-script != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CERTIFICATION_VERIFICATION_SCRIPT: ${{ inputs.certification-verification-script }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_SHA: ${{ steps.release-context.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.release-context.outputs.tag }}
          RELEASE_ARTIFACT_PATH: ${{ steps.pack.outputs.path }}
          RELEASE_ARTIFACT_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ ! -f "$CERTIFICATION_VERIFICATION_SCRIPT" ]; then
            echo "::error::certification-verification-script '$CERTIFICATION_VERIFICATION_SCRIPT' not found" >&2
            exit 1
          fi
          if [ ! -f "$RELEASE_ARTIFACT_PATH" ]; then
            echo "::error::release artifact '$RELEASE_ARTIFACT_PATH' not found" >&2
            exit 1
          fi
          node "$CERTIFICATION_VERIFICATION_SCRIPT"

      - name: Verify packed tarball unchanged
        if: inputs.certification-verification-script != ''
        shell: bash
        env:
          RELEASE_ARTIFACT_PATH: ${{ steps.pack.outputs.path }}
          EXPECTED_TARBALL_SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum "$RELEASE_ARTIFACT_PATH" | cut -d ' ' -f 1)"
          if [ "$actual_sha256" != "$EXPECTED_TARBALL_SHA256" ]; then
            echo "::error::release certification changed the packed tarball bytes" >&2
            exit 1
          fi

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-tarball
          path: ${{ steps.pack.outputs.path }}
          if-no-files-found: error
          retention-days: 1

      - name: Restore release tooling for action cleanup
        if: always()
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/release-tools" ] && [ ! -e .release-tools ]; then
            mv "$RUNNER_TEMP/release-tools" .release-tools
          fi

  smoke-test:
    name: Smoke test (Node ${{ matrix.node-version }})
    needs: [plan, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(needs.plan.outputs.smoke_test_node_versions) }}
    steps:
      - name: Checkout
        if: ${{ !inputs.dry-run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.repository != '' && inputs.repository || github.repository }}
          ref: refs/tags/${{ inputs.release-tag != '' && inputs.release-tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Checkout (dry-run)
        if: ${{ inputs.dry-run }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: ${{ inputs.working-directory }}

      - name: Smoke test packed tarball
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TARBALL_NAME: ${{ needs.build.outputs.tarball-name }}
          EXPECTED_TARBALL_SHA256: ${{ needs.build.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          if [ ! -f "$TARBALL_NAME" ]; then
            echo "::error::expected packed tarball '$TARBALL_NAME' was not downloaded" >&2
            exit 1
          fi
          actual_sha256="$(sha256sum "$TARBALL_NAME" | cut -d ' ' -f 1)"
          if [ "$actual_sha256" != "$EXPECTED_TARBALL_SHA256" ]; then
            echo "::error::downloaded tarball bytes do not match the packed tarball" >&2
            exit 1
          fi
          node scripts/smoke-test.mjs --tarball "$TARBALL_NAME"

  publish:
    name: Publish (OIDC Trusted Publishing)
    needs: [build, smoke-test]
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Require an OIDC-capable npm CLI
        env:
          NPM_CLI_VERSION: ${{ inputs.npm-cli-version }}
        run: npm install --global "npm@$NPM_CLI_VERSION"

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-tarball
          path: ${{ inputs.working-directory }}

      - name: Verify downloaded tarball
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TARBALL_NAME: ${{ needs.build.outputs.tarball-name }}
          EXPECTED_TARBALL_SHA256: ${{ needs.build.outputs.tarball-sha256 }}
        run: |
          set -euo pipefail
          if [ ! -f "$TARBALL_NAME" ]; then
            echo "::error::expected packed tarball '$TARBALL_NAME' was not downloaded" >&2
            exit 1
          fi
          actual_sha256="$(sha256sum "$TARBALL_NAME" | cut -d ' ' -f 1)"
          if [ "$actual_sha256" != "$EXPECTED_TARBALL_SHA256" ]; then
            echo "::error::downloaded tarball bytes do not match the packed tarball" >&2
            exit 1
          fi

      - name: Check whether version is already published
        id: registry
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_NAME: ${{ needs.build.outputs.package-name }}
          PACKAGE_VERSION: ${{ needs.build.outputs.package-version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.registry.outputs.published != 'true'
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          TARBALL_NAME: ${{ needs.build.outputs.tarball-name }}
        run: |
          set -euo pipefail
          npm publish "$TARBALL_NAME"
