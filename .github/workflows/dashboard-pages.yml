name: Developer portal Pages

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "dashboard/**"
      - "messages.js"
      - "scripts/build-dashboard.mjs"
      - "scripts/dashboard-data.mjs"
      - "scripts/governance-health.mjs"
      - "scripts/portal-registry.mjs"
      - "scripts/inari-governance.mjs"
      - "scripts/product-catalog.mjs"
      - "scripts/product-details.mjs"
      - "scripts/render-portal.mjs"
      - "scripts/github-pr-links.mjs"
      - "scripts/pull-request-links.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-pages.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json

      - name: Install portal build dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve portal collection scope
        id: portal-scope
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import {
            dashboardConfigFromRegistry,
            loadPortalRegistry
          } from "./scripts/portal-registry.mjs";

          const registry = await loadPortalRegistry("portal/registry.json");
          const config = dashboardConfigFromRegistry(registry);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `owner=${config.organization}\nrepositories=${config.repositories.join(",")}\n`
          );
          NODE

      - name: Create portal collection token
        id: portal-token
        if: ${{ vars.PORTAL_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PORTAL_APP_PRIVATE_KEY }}
          owner: ${{ steps.portal-scope.outputs.owner }}
          repositories: ${{ steps.portal-scope.outputs.repositories }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Generate portal and dashboard data
        env:
          PORTAL_GITHUB_TOKEN: ${{ steps.portal-token.outputs.token }}
        run: node scripts/build-dashboard.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@fc324d3547104276b827a68afc52ff2a11cc49c9 # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy portal
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
