name: Developer portal Pages

on:
  push:
    branches: [main]
    paths:
      - "portal/**"
      - "dashboard/**"
      - "scripts/build-dashboard.mjs"
      - "scripts/dashboard-data.mjs"
      - "scripts/portal-registry.mjs"
      - "scripts/inari-governance.mjs"
      - "scripts/product-catalog.mjs"
      - "scripts/product-details.mjs"
      - "scripts/render-portal.mjs"
      - "scripts/github-pr-links.mjs"
      - "scripts/pull-request-links.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-pages.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install portal build dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve portal collection scope
        id: portal-scope
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from "node:fs";
          import {
            dashboardConfigFromRegistry,
            loadPortalRegistry
          } from "./scripts/portal-registry.mjs";

          const registry = await loadPortalRegistry("portal/registry.json");
          const config = dashboardConfigFromRegistry(registry);
          appendFileSync(
            process.env.GITHUB_OUTPUT,
            `owner=${config.organization}\nrepositories=${config.repositories.join(",")}\n`
          );
          NODE

      - name: Create portal collection token
        id: portal-token
        if: ${{ vars.PORTAL_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PORTAL_APP_CLIENT_ID }}
          private-key: ${{ secrets.PORTAL_APP_PRIVATE_KEY }}
          owner: ${{ steps.portal-scope.outputs.owner }}
          repositories: ${{ steps.portal-scope.outputs.repositories }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-metadata: read

      - name: Generate portal and dashboard data
        env:
          PORTAL_GITHUB_TOKEN: ${{ steps.portal-token.outputs.token }}
        run: node scripts/build-dashboard.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: Deploy portal
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
