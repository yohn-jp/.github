name: gh extension precompiled release

# Reusable workflow: checks out an exact Release/tag source revision, runs
# the consumer's version-controlled build entrypoint
# (scripts/build-gh-extension-release.sh) to produce already-finished,
# already correctly-named precompiled GitHub CLI extension artifacts,
# verifies their naming/presence, and uploads them to that already-existing
# GitHub Release.
#
# The consumer owns build implementation end-to-end — language/toolchain
# setup, dependency install, build, cross-platform strategy, and which
# target platforms it ships — entirely inside that committed script. This
# workflow takes no caller-controlled command to execute; it owns only the
# fixed entrypoint invocation, the GitHub CLI artifact naming contract
# (`<extension-name>-<os>-<arch>[.exe]`, see
# https://docs.github.com/en/github-cli/github-cli/creating-github-cli-extensions),
# generic pre-upload validation, and the Release upload — so it stays
# reusable across any GitHub CLI extension repository regardless of
# implementation language. An optional certification-verification-script
# input can gate the release on a consumer-owned Node script; unlike the
# build entrypoint, this is opt-in and pulls in a pnpm/Node setup only when
# requested, to keep the non-Node/non-gated default fully toolchain-neutral.
on:
  workflow_call:
    inputs:
      release-tag:
        description: >-
          Exact Release/tag name to check out, build from, and upload
          artifacts to (e.g. the release event's tag_name).
        type: string
        required: true
      working-directory:
        description: Directory containing the extension source to build.
        type: string
        default: "."
      extension-name:
        description: >-
          Extension name used as the required artifact filename prefix.
          Defaults to the repository name, which is the correct value for a
          conventionally named `gh-<name>` extension repository.
        type: string
        default: ""
      certification-verification-script:
        description: >-
          Optional path (relative to working-directory) to a consumer-owned,
          version-controlled Node script that fails closed unless the
          consumer's own release-certification evidence is complete and
          valid. Run with no workflow-controlled arguments via
          `node --import tsx` after a pnpm install in working-directory (the
          consumer's package.json must declare an exact pnpm `packageManager`
          version, same as the `npm-publish.yml` contract) — the script owns
          locating or producing its own evidence and exits non-zero to block
          the release. Empty (default) skips this gate and the Node/pnpm
          setup it requires entirely.
        type: string
        default: ""
    secrets: {}

permissions:
  contents: read

jobs:
  release:
    name: Build, verify, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ${{ inputs.release-tag }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release-tag }}
          persist-credentials: false

      - name: Resolve extension name
        id: extension
        shell: bash
        env:
          EXTENSION_NAME_INPUT: ${{ inputs.extension-name }}
        run: |
          set -euo pipefail
          name="$EXTENSION_NAME_INPUT"
          if [ -z "$name" ]; then
            name="${GITHUB_REPOSITORY#*/}"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Checkout release tooling (yohn-jp/.github)
        if: inputs.certification-verification-script != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tools
          persist-credentials: false

      - name: Setup Node.js and pnpm for release certification
        if: inputs.certification-verification-script != ''
        uses: ./.release-tools/.github/actions/setup-node-pnpm
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Isolate release tooling
        if: inputs.certification-verification-script != ''
        shell: bash
        run: mv .release-tools "$RUNNER_TEMP/release-tools"

      - name: Verify release certification
        if: inputs.certification-verification-script != ''
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          CERTIFICATION_VERIFICATION_SCRIPT: ${{ inputs.certification-verification-script }}
        run: |
          set -euo pipefail
          if [ ! -f "$CERTIFICATION_VERIFICATION_SCRIPT" ]; then
            echo "::error::certification-verification-script '$CERTIFICATION_VERIFICATION_SCRIPT' not found" >&2
            exit 1
          fi
          node --import tsx "$CERTIFICATION_VERIFICATION_SCRIPT"

      - name: Run consumer build entrypoint
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/gh-extension-artifacts
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          rm -rf -- "$ARTIFACT_DIR"
          mkdir -p -- "$ARTIFACT_DIR"
          entrypoint="./scripts/build-gh-extension-release.sh"
          if [ ! -f "$entrypoint" ]; then
            echo "::error::$entrypoint not found in $WORKING_DIRECTORY (required, version-controlled build entrypoint)" >&2
            exit 1
          fi
          bash "$entrypoint"

      - name: Verify artifacts
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/gh-extension-artifacts
          EXTENSION_NAME: ${{ steps.extension.outputs.name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=("$ARTIFACT_DIR"/*)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::no artifacts produced in $ARTIFACT_DIR" >&2
            exit 1
          fi
          # os/arch vocabulary per GitHub CLI's precompiled-extension naming
          # contract (the platform identifiers `gh` itself recognizes) —
          # this is a naming/discovery requirement, not a build toolchain.
          os_pattern="darwin|freebsd|linux|windows|android"
          arch_pattern="amd64|arm64|386|arm"
          name_pattern="^${EXTENSION_NAME}-(${os_pattern})-(${arch_pattern})(\.exe)?\$"
          for f in "${assets[@]}"; do
            base="$(basename "$f")"
            if [[ ! "$base" =~ $name_pattern ]]; then
              echo "::error::$base does not match the required <extension-name>-<os>-<arch>[.exe] naming (extension-name: $EXTENSION_NAME)" >&2
              exit 1
            fi
            if [[ "$base" == *"-windows-"* && "$base" != *.exe ]]; then
              echo "::error::$base targets windows but is missing the required .exe suffix" >&2
              exit 1
            fi
            if [[ "$base" != *"-windows-"* && "$base" == *.exe ]]; then
              echo "::error::$base has a .exe suffix but does not target windows" >&2
              exit 1
            fi
            if [ ! -s "$f" ]; then
              echo "::error::$base is empty" >&2
              exit 1
            fi
            echo "verified $base"
          done

      - name: Upload assets to release ${{ inputs.release-tag }}
        shell: bash
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/gh-extension-artifacts
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber -- "$ARTIFACT_DIR"/*

      - name: Restore release tooling for action cleanup
        if: always() && inputs.certification-verification-script != ''
        shell: bash
        run: |
          if [ -d "$RUNNER_TEMP/release-tools" ] && [ ! -e .release-tools ]; then
            mv "$RUNNER_TEMP/release-tools" .release-tools
          fi
