# Machine-readable contract for the organization quality lanes.  The
# provider workflows and the aggregate caller are versioned independently;
# this file describes the stable boundary they share.
schema-version: 1
kind: organization-quality-ci-contract

aggregate:
  workflow: organization-quality.yml
  job-id: quality
  status: quality
  condition: always
  result-policy:
    pass: [success, skipped]
    fail: [failure, cancelled, timed_out, action_required]

defaults:
  runner: ubuntu-latest
  permissions:
    contents: read
  forbidden-keys:
    - strategy.matrix
    - github.repository
    - github.repository_owner

lanes:
  static-quality:
    workflow: static-quality.yml
    output: status
    capabilities: [dead-code, dependency-analysis, maintainability]
    permissions:
      contents: read
    inputs:
      working-directory:
        type: string
        required: false
        default: "."
      execution-mode:
        type: string
        required: false
        default: pr
        allowed: [pr, main, nightly]
      config-file:
        type: string
        required: false
        default: ""
      baseline-file:
        type: string
        required: false
        default: ""
      check-command:
        type: string
        required: false
        default: ""

  supply-chain-security:
    workflow: supply-chain-security.yml
    output: status
    capabilities: [dependency-review, codeql]
    permissions:
      contents: read
      pull-requests: read
      job-scoped:
        codeql:
          actions: read
          security-events: write
    inputs:
      working-directory:
        type: string
        required: false
        default: "."
      execution-mode:
        type: string
        required: false
        default: pr
        allowed: [pr, main, nightly]
      severity:
        type: string
        required: false
        default: high
        allowed: [low, moderate, high, critical]
      license-policy-file:
        type: string
        required: false
        default: ""
      codeql-config-file:
        type: string
        required: false
        default: ""

  workflow-security:
    workflow: workflow-security.yml
    output: status
    capabilities: [workflow-syntax, workflow-policy]
    permissions:
      contents: read
    inputs:
      workflow-paths:
        type: string
        required: false
        default: .github/workflows/**
      config-file:
        type: string
        required: false
        default: ""
      execution-mode:
        type: string
        required: false
        default: pr
        allowed: [pr, main, nightly]

  test-effectiveness:
    workflow: test-effectiveness.yml
    output: status
    capabilities: [coverage, property, mutation]
    permissions:
      contents: read
    inputs:
      working-directory:
        type: string
        required: false
        default: "."
      execution-mode:
        type: string
        required: false
        default: pr
        allowed: [pr, main, nightly]
      node-version:
        type: string
        required: false
        default: "24"
      install-command:
        type: string
        required: false
        default: ""
      mutation-timeout-seconds:
        type: number
        required: false
        default: 600
      coverage-enabled:
        type: boolean
        required: false
        default: false
      coverage-command:
        type: string
        required: false
        default: ""
      coverage-regression-command:
        type: string
        required: false
        default: ""
      coverage-baseline-path:
        type: string
        required: false
        default: ""
      coverage-report-path:
        type: string
        required: false
        default: ""
      coverage-config-path:
        type: string
        required: false
        default: ""
      property-enabled:
        type: boolean
        required: false
        default: false
      property-command:
        type: string
        required: false
        default: ""
      property-randomized:
        type: boolean
        required: false
        default: false
      property-seed:
        type: string
        required: false
        default: ""
      replay-seed:
        type: string
        required: false
        default: ""
      property-replay-command:
        type: string
        required: false
        default: ""
      property-report-path:
        type: string
        required: false
        default: ""
      property-config-path:
        type: string
        required: false
        default: ""
      mutation-enabled:
        type: boolean
        required: false
        default: false
      mutation-command:
        type: string
        required: false
        default: ""
      mutation-report-path:
        type: string
        required: false
        default: ""
      mutation-config-path:
        type: string
        required: false
        default: ""
