<!doctype html>
<!-- Canonical site origin: https://dev.yohn.jp/ -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content=""
      data-message-content="portal.meta.description"
    />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    {{HREFLANG_LINKS}}
    <title data-message="portal.title"></title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-nav-wrap">
      <nav
        class="shell site-nav"
        aria-label=""
        data-message-aria-label="portal.nav.primary"
      >
        <a
          class="brand"
          href="./"
          aria-label=""
          data-message-aria-label="portal.nav.home"
          ><span class="brand-slash">/</span><span>yohn-jp</span></a
        >
        <div class="nav-links">
          <a href="#products" data-message="portal.nav.products"></a>
          <a href="#system" data-message="portal.nav.system"></a>
          <a href="./work/" data-message="portal.nav.work"></a>
          <a href="./work/governance/" data-message="portal.nav.governance"></a>
          <a href="./work/graph/" data-message="portal.nav.graph"></a>
          <a
            href="https://github.com/yohn-jp"
            rel="noreferrer"
            data-message="portal.nav.github"
          ></a>
        </div>
        <details class="mobile-nav">
          <summary class="mobile-nav-toggle">
            <span class="mobile-nav-icon" aria-hidden="true"
              ><span></span><span></span><span></span
            ></span>
            <span data-message="portal.nav.menu"></span>
          </summary>
          <div class="mobile-nav-panel">
            <div class="mobile-nav-links">
              <a href="#products" data-message="portal.nav.products"></a>
              <a href="#system" data-message="portal.nav.system"></a>
              <a href="./work/" data-message="portal.nav.work"></a>
              <a
                href="./work/governance/"
                data-message="portal.nav.governance"
              ></a>
              <a href="./work/graph/" data-message="portal.nav.graph"></a>
              <a
                href="https://github.com/yohn-jp"
                rel="noreferrer"
                data-message="portal.nav.github"
              ></a>
            </div>
          </div>
        </details>
        {{LANGUAGE_SELECTOR}}
      </nav>
    </header>

    <main>
      <section class="shell hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow" data-message="portal.hero.eyebrow"></p>
          <h1 id="hero-title">
            <span data-message="portal.hero.titleLead"></span><br /><span
              data-message="portal.hero.titleEmphasis"
            ></span>
          </h1>
          <p class="lede" data-message="portal.hero.lede"></p>
          <div class="hero-actions">
            <a
              class="button dark"
              href="#products"
              data-message="portal.hero.browseProducts"
            ></a>
            <a
              class="button light"
              href="./work/"
              data-message="portal.hero.seeWork"
            ></a>
          </div>
        </div>
        <aside
          class="hero-note"
          aria-label=""
          data-message-aria-label="portal.hero.designPrinciple"
        >
          <span class="hero-note-index">01</span>
          <p data-message="portal.hero.note"></p>
          <span
            class="hero-note-caption"
            data-message="portal.hero.sourceOfTruth"
          ></span>
        </aside>
      </section>

      <section
        class="principles"
        aria-label=""
        data-message-aria-label="portal.principles.title"
      >
        <div class="shell principle-grid">
          <div>
            <span>01</span
            ><strong
              data-message="portal.principles.explicitAuthority.title"
            ></strong>
            <p data-message="portal.principles.explicitAuthority.body"></p>
          </div>
          <div>
            <span>02</span
            ><strong
              data-message="portal.principles.machineReadable.title"
            ></strong>
            <p data-message="portal.principles.machineReadable.body"></p>
          </div>
          <div>
            <span>03</span
            ><strong data-message="portal.principles.failClosed.title"></strong>
            <p data-message="portal.principles.failClosed.body"></p>
          </div>
        </div>
      </section>

      <section
        id="products"
        class="shell section"
        aria-labelledby="products-heading"
      >
        <div class="section-head">
          <div>
            <p class="eyebrow" data-message="portal.products.eyebrow"></p>
            <h2 id="products-heading" data-message="portal.products.title"></h2>
          </div>
          <p data-message="portal.products.body"></p>
        </div>
        <div class="product-grid">{{PRODUCT_CARDS}}</div>
      </section>

      <section
        id="system"
        class="system-section"
        aria-labelledby="system-heading"
      >
        <div class="shell">
          <div class="section-head inverse">
            <div>
              <p class="eyebrow" data-message="portal.system.eyebrow"></p>
              <h2 id="system-heading" data-message="portal.system.title"></h2>
            </div>
            <p data-message="portal.system.body"></p>
          </div>
          <div class="system-layout">
            <div
              class="system-nodes"
              aria-label=""
              data-message-aria-label="portal.system.nodes"
            >
              {{SYSTEM_NODES}}
            </div>
            <div class="relationship-panel">
              <p
                class="relationship-title"
                data-message="portal.system.relationships"
              ></p>
              <ul class="relationship-list">
                {{RELATIONSHIPS}}
              </ul>
            </div>
          </div>
        </div>
      </section>

      <section class="shell work-strip" aria-labelledby="work-heading">
        <div>
          <p class="eyebrow" data-message="portal.work.eyebrow"></p>
          <h2 id="work-heading" data-message="portal.work.title"></h2>
          <p data-message="portal.work.body"></p>
        </div>
        <div class="work-actions">
          <a
            class="button accent"
            href="./work/"
            data-message="portal.work.openDashboard"
          ></a>
          <a
            class="button light"
            href="./work/governance/"
            data-message="portal.work.openGovernance"
          ></a>
        </div>
      </section>
    </main>

    <footer class="shell footer">
      <span data-message="portal.footer.identity"></span>
      <div>
        <a
          href="https://github.com/yohn-jp/.github"
          rel="noreferrer"
          data-message="portal.footer.source"
        ></a
        ><a href="./work/" data-message="portal.nav.work"></a
        ><a href="./work/governance/" data-message="portal.nav.governance"></a>
      </div>
    </footer>
  </body>
</html>
