<!doctype html>
<!-- Canonical site origin: https://dev.yohn.jp/ -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content=""
      data-message-content="work.meta.description"
    />
    <link rel="canonical" href="{{CANONICAL_URL}}" />
    {{HREFLANG_LINKS}}
    <title data-message="work.title"></title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="./work.css" />
    <script defer src="../motion.js"></script>
    <script type="module" src="./app.js"></script>
  </head>
  <body class="work-page">
    <header class="site-nav-wrap">
      <nav
        class="shell site-nav"
        aria-label=""
        data-message-aria-label="work.nav.primary"
      >
        <a
          class="brand"
          href="../"
          aria-label=""
          data-message-aria-label="work.nav.home"
          ><span class="brand-slash">/</span><span>yohn-jp</span></a
        >
        <div class="nav-links">
          <a href="../#products" data-message="work.nav.products"></a>
          <a href="../#system" data-message="work.nav.system"></a>
          <a aria-current="page" href="./" data-message="work.nav.work"></a>
          <a href="./governance/" data-message="work.nav.governance"></a>
          <a href="./graph/" data-message="work.nav.graph"></a>
          <a
            href="https://github.com/yohn-jp"
            rel="noreferrer"
            data-message="work.nav.github"
          ></a>
        </div>
        <details class="mobile-nav">
          <summary class="mobile-nav-toggle">
            <span class="mobile-nav-icon" aria-hidden="true"
              ><span></span><span></span><span></span
            ></span>
            <span data-message="work.nav.menu"></span>
          </summary>
          <div class="mobile-nav-panel">
            <div class="mobile-nav-links">
              <a href="../#products" data-message="work.nav.products"></a>
              <a href="../#system" data-message="work.nav.system"></a>
              <a aria-current="page" href="./" data-message="work.nav.work"></a>
              <a href="./governance/" data-message="work.nav.governance"></a>
              <a href="./graph/" data-message="work.nav.graph"></a>
              <a
                href="https://github.com/yohn-jp"
                rel="noreferrer"
                data-message="work.nav.github"
              ></a>
            </div>
          </div>
        </details>
        {{LANGUAGE_SELECTOR}}
      </nav>
    </header>

    <main class="shell work-content">
      <header class="work-header" aria-labelledby="work-title">
        <div class="work-heading">
          <p class="eyebrow" data-message="work.header.eyebrow"></p>
          <h1 id="work-title" data-message="work.header.title"></h1>
          <p class="work-lede" data-message="work.header.lede"></p>
        </div>
        <div
          class="snapshot-controls"
          aria-label=""
          data-message-aria-label="work.snapshot.aria"
        >
          <div>
            <p
              id="generated-at"
              class="generated-at"
              data-message="work.snapshot.loading"
            ></p>
            <p
              id="snapshot-freshness"
              class="snapshot-freshness"
              aria-live="polite"
              data-message="work.snapshot.checking"
            ></p>
          </div>
          <button
            id="refresh-dashboard"
            class="refresh-button"
            type="button"
            data-message="work.snapshot.refresh"
          ></button>
        </div>
      </header>

      <div class="work-surface">
        <section
          id="dataset-status"
          class="status-banner"
          role="status"
          aria-live="polite"
          hidden
        ></section>

        <section
          class="work-summary"
          aria-label=""
          data-message-aria-label="work.metrics.aria"
        >
          <div id="metrics" class="metrics" aria-live="polite"></div>
        </section>

        <section class="issue-section" aria-labelledby="issues-heading">
          <div class="issue-heading">
            <h2 id="issues-heading" data-message="work.issues.title"></h2>
            <p id="issue-count" class="result-count" aria-live="polite"></p>
          </div>
          <div
            class="filters"
            aria-label=""
            data-message-aria-label="work.issues.filters.aria"
          >
            <label
              ><span data-message="work.filters.view"></span
              ><select id="view-filter"></select
            ></label>
            <label
              ><span data-message="work.filters.governance"></span
              ><select id="governance-filter"></select
            ></label>
            <label
              ><span data-message="work.filters.repository"></span
              ><select id="repository-filter">
                <option
                  value=""
                  data-message="work.repositories.all"
                ></option></select
            ></label>
            <label
              ><span data-message="work.filters.sort"></span
              ><select id="sort-filter"></select
            ></label>
            <label class="search-label"
              ><span data-message="work.filters.search"></span
              ><input
                id="issue-search"
                type="search"
                placeholder=""
                data-message-placeholder="work.filters.searchPlaceholder"
                autocomplete="off"
            /></label>
          </div>
          <div
            id="issue-list"
            class="issue-list"
            role="list"
            aria-live="polite"
          >
            <p class="empty-state" data-message="work.issues.loading"></p>
          </div>
        </section>

        <section
          class="distribution-section"
          aria-labelledby="distribution-heading"
        >
          <div class="work-section-head">
            <div>
              <p class="eyebrow" data-message="work.distribution.eyebrow"></p>
              <h2
                id="distribution-heading"
                data-message="work.distribution.title"
              ></h2>
            </div>
            <p>
              <span data-message="work.distribution.body"></span>
              <a href="./graph/" data-message="work.distribution.graphLink"></a>
              <a
                href="./governance/"
                data-message="work.distribution.governanceLink"
              ></a>
            </p>
          </div>
          <div id="repository-summary" class="repository-summary"></div>
        </section>
      </div>
    </main>

    <footer class="shell footer">
      <span data-message="work.footer.sourceOfTruth"></span>
      <div>
        <a href="./graph/" data-message="work.footer.graph"></a
        ><a href="./governance/" data-message="work.footer.governance"></a
        ><a href="../" data-message="work.footer.portalHome"></a
        ><a
          href="https://github.com/yohn-jp/.github/issues"
          rel="noreferrer"
          data-message="work.footer.issues"
        ></a>
      </div>
    </footer>
  </body>
</html>
