name: correct cross-repository provider tooling resolution
on:
  workflow_call: {}
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout provider tooling (yohn-jp/.github)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .provider-tools
      - uses: ./.provider-tools/.github/actions/setup-node-pnpm
        with:
          node-version: "24"
      - name: Isolate provider tooling
        shell: bash
        run: mv .provider-tools "$RUNNER_TEMP/provider-tools"
      - name: Restore provider tooling for action cleanup
        if: always()
        shell: bash
        run: mv "$RUNNER_TEMP/provider-tools" .provider-tools
  nested-reusable-workflow:
    uses: ./.github/workflows/metadata-validation.yml
