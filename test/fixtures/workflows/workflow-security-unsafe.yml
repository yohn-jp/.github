name: Unsafe security fixture

on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  untrusted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Execute pull request title
        run: echo "${{ github.event.pull_request.title }}"
